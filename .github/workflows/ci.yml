name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

  live-source-sync:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sync all five live regulatory sources
        run: python scripts/sync_live_sources.py
      - name: Verify populated normalized snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          names=["taric_measures","eucdm","echa_candidate_list","scip_schema","eu_sanctions"]
          for n in names:
              p=Path("data/normalized")/n/"latest.json"
              assert p.exists(), f"{n}: latest.json missing"
              x=json.loads(p.read_text())
              assert x["validation"]["valid"], f"{n}: invalid"
              assert x["validation"]["record_count"]>0, f"{n}: empty"\n              assert x.get("transport") != "AUTHORITY_METADATA_FALLBACK" or n == "scip_schema", f"{n}: metadata fallback not allowed"
              print(n,x["validation"]["record_count"],x["sha256"])
          PY
