name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run unit, API and web smoke tests
        env:
          PYTHONPATH: .
        run: pytest -q
# External regulatory feeds have a separate, strict scheduled workflow:
# .github/workflows/live-regulatory-integrity.yml
# Its failures must be investigated; never substitute metadata for missing content.
