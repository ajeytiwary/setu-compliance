name: Nightly full validation
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Full suite including 100K scale (required green before release)
        run: pytest -q
      - name: Regulatory content validation
        run: pytest -q tests/test_regulatory_content.py
      - name: Claim lint
        run: python scripts/lint_claims.py
