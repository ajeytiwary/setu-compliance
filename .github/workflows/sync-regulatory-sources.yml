name: Sync pluggable regulatory sources
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Sync official source distributions
        env:
          EUROSETU_TARIC_BULK_URL: ${{ secrets.EUROSETU_TARIC_BULK_URL }}
        run: python scripts/sync_sources.py --strict
      - name: Commit validated snapshots
        run: |
          git config user.name "eurosetu-regulatory-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only the CI snapshot pointers are tracked (see .gitignore):
          # data/normalized/*/latest.json + data/manifests/**. Raw payloads
          # stay local (re-downloadable, hash-verified via manifests).
          git add -f data/normalized/*/latest.json data/manifests
          git diff --cached --quiet || git commit -m "data: refresh regulatory source snapshots"
          git push
