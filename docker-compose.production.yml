services:
  app:
    build: .
    environment:
      EUROSETU_ENV: production
      EUROSETU_SPLIT_HOSTS: ${EUROSETU_SPLIT_HOSTS:-0}
      EUROSETU_APP_HOST: ${EUROSETU_APP_HOST:-app.eurosetu.trade}
      EUROSETU_PUBLIC_PROXY_SECRET: ${EUROSETU_PUBLIC_PROXY_SECRET:-}
      EUROSETU_DB_PATH: /app/data/eurosetu.db
      EUROSETU_DEPLOYMENT_TENANT: ${EUROSETU_DEPLOYMENT_TENANT:?Set the sole tenant ID for this isolated deployment}
      EUROSETU_BACKUP_BUCKET: ${EUROSETU_BACKUP_BUCKET:-}
      EUROSETU_BACKUP_S3_ENDPOINT: ${EUROSETU_BACKUP_S3_ENDPOINT:-}
      EUROSETU_RECURRING_SAAS_ENABLED: ${EUROSETU_RECURRING_SAAS_ENABLED:-0}
      EUROSETU_JWT_SECRET: ${EUROSETU_JWT_SECRET:?Set a production authentication secret}
      EUROSETU_INGEST_LLM_BASE_URL: ${EUROSETU_INGEST_LLM_BASE_URL:-http://172.17.0.1:8787/api/v1}
      EUROSETU_INGEST_LLM_MODEL: ${EUROSETU_INGEST_LLM_MODEL:-deepseek/deepseek-v4-flash}
      EUROSETU_INGEST_LLM_API_KEY: ${EUROSETU_INGEST_LLM_API_KEY:-}
    volumes:
      - eurosetu_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  eurosetu_data:
