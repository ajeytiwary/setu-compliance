services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eurosetu
      POSTGRES_USER: eurosetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - eurosetu_pg:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://eurosetu:${POSTGRES_PASSWORD}@db:5432/eurosetu
      EUROSETU_ENV: production
    depends_on:
      - db
    ports:
      - "8000:8000"
volumes:
  eurosetu_pg:
